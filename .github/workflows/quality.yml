name: Theme Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -name '*.php' -not -path './.git/*' -print0)

  runtime:
    name: Browser runtime and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check assets/js/ajaxinwp.js

      - name: Assert navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e inc/ajax-redirect.php
          ! grep -q "require_once.*ajax-redirect.php" functions.php
          ! grep -q "wp_enqueue_script('jquery')" functions.php
          ! grep -q "ajaxinwp_handle_ajax_requests" functions.php
          ! grep -q "wp_generate_attachment_metadata" functions.php
          grep -q "AbortController" assets/js/ajaxinwp.js
          grep -q "window.location.assign" assets/js/ajaxinwp.js
          grep -q "#ajax-container" assets/js/ajaxinwp.js
          grep -q "id=\"ajax-container\"" index.php
          grep -q "Requires at least: 6.3" style.css
          grep -q "Requires PHP: 8.0" style.css
          grep -q "GNU General Public License v2 or later" README.md

      - name: Check whitespace
        run: git diff --check HEAD^
